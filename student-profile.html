    <main>
        <section class="profile-form-section">
            <div class="container">
                <h2>Create Your Student Profile</h2>
                <form id="student-profile-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="grade">Grade Level:</label>
                        <input type="text" id="grade" name="grade" required>
                    </div>
                    <div class="form-group">
                        <label for="goals">Learning Goals:</label>
                        <textarea id="goals" name="goals" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="primary-cta-button">Create Profile</button>
                </form>
            </div>
        </section>
    </main>
